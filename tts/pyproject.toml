[project]
name = "hermescall-tts"
version = "0.7.2"
description = "hermes-call-tts: local German speech (Kokoro fine-tunes) for Hermes Call, loopback only"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["aiohttp>=3.10,<4", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermescall_tts"]
