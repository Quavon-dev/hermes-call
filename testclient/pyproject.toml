[project]
name = "hermescall-testclient"
version = "0.7.0"
description = "Command-line stand-in for the Hermes Call iPhone app (development only)"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["hermescall-common", "hermescall-bridge", "sounddevice>=0.5"]

[project.scripts]
hermescall-testclient = "hermescall_testclient.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermescall_testclient"]
