[project]
name = "hermescall-relay"
version = "0.6.2"
description = "Hermes Call relay: signaling rendezvous, TURN credentials and VoIP push"
requires-python = ">=3.11"
license = "MIT"
# Floors = Debian 12 packages (what installed relays run; CI job relay-distro tests them).
dependencies = [
    "hermescall-common",
    "aiohttp>=3.8.4,<4",
    "httpx[http2]>=0.23.3,<1",
    "cryptography>=38.0.4",
]

[project.scripts]
hermescall-relay = "hermescall_relay.cli:main"
hermescall-push-gateway = "hermescall_relay.gateway:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermescall_relay"]
