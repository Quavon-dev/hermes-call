# Hermes Call relay with Docker Compose: relay + coturn + Caddy (Let's Encrypt via TLS-ALPN).
# For hosts where you would rather not run install.sh (which uses distribution packages and
# systemd). Setup, once, in a copy of relay/deploy/ (see docs/relay.md, "Docker Compose"):
#
#   cp compose/relay.toml.example config/relay.toml            # set authority, turn urls
#   cp compose/turnserver.conf.example config/turnserver.conf  # set realm, external-ip if NATed
#   openssl rand -hex 32 > config/turn_secret                  # same value in turnserver.conf
#   openssl genpkey -algorithm ed25519 -out config/push_gateway_key
#   sudo chown -R 10001:10001 config && chmod 600 config/turn_secret config/push_gateway_key
#   RELAY_DOMAIN=relay.example.com docker compose up -d
#   docker compose exec relay python3 -m hermescall_relay.cli --config /etc/hermescall-relay/relay.toml pair
#
# Ports: 443/tcp (Caddy), 3478/udp+tcp and 49160-49200/udp (coturn, host network).
# The relay image is pinned to a release (HERMESCALL_RELAY_VERSION, default: the release this file
# came with), never :latest or :edge. Update: HERMESCALL_RELAY_VERSION=X.Y.Z docker compose up -d.
# Pin the image digests (image: name@sha256:...) once it works; updates are then a deliberate edit.
name: hermes-call

services:
  relay:
    image: ghcr.io/quavon-dev/hermes-call-relay:${HERMESCALL_RELAY_VERSION:-0.7.0}
    command: ["-m", "hermescall_relay.cli", "--config", "/etc/hermescall-relay/relay.toml", "serve"]
    environment:
      HEALTH_PORT: "8743"
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./config:/etc/hermescall-relay:ro
      - relay-data:/var/lib/hermescall-relay
    networks: [relay]
    restart: unless-stopped
    stop_grace_period: 20s

  caddy:
    image: caddy:2
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?set RELAY_DOMAIN to the relay's DNS name}
    ports:
      - "443:443/tcp"
    volumes:
      - ./compose/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks:
      relay:
        # The only address relay.toml trusts for X-Forwarded-For (trusted_proxies). Not .1: that
        # is the bridge gateway, the source of Docker's userland proxy and of the host itself.
        ipv4_address: 172.30.87.10
    depends_on: [relay]
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4
    # TURN needs the real addresses and a port range: host networking is the practical choice.
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./config/turnserver.conf:/etc/coturn/turnserver.conf:ro
    read_only: true
    tmpfs: [/var/lib/coturn, /var/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  relay:
    # Fixed so Caddy has a fixed address (172.30.87.10) that relay.toml can trust.
    ipam:
      config:
        - subnet: 172.30.87.0/24

volumes:
  relay-data:
  caddy-data:
