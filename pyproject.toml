[project]
name = "hermes-call-dev"
version = "0.6.2"
requires-python = ">=3.11"
dependencies = ["hermescall-common", "hermescall-relay", "hermescall-bridge", "hermescall-testclient"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-aiohttp>=1.0", "pytest-cov>=5", "ruff>=0.6"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["common", "relay", "bridge", "testclient"]

[tool.uv.sources]
hermescall-common = { workspace = true }
hermescall-relay = { workspace = true }
hermescall-bridge = { workspace = true }
hermescall-testclient = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["common/tests", "relay/tests", "bridge/tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "ASYNC"]
ignore = ["S101", "S603", "ASYNC109"]


[tool.ruff.lint.per-file-ignores]
"tools/*" = ["S104", "S607", "ASYNC220", "ASYNC221", "ASYNC240"]
"*/tests/*" = ["S105", "S106", "S107", "B008", "S311", "ASYNC110", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["hermescall_common", "hermescall_relay", "hermescall_bridge", "hermescall_testclient"]
