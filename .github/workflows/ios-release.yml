name: iOS release

# When the app itself changed (or when started by hand), the same model as Quavon's jackpoll:
#   ios        version + build number from App Store Connect (tools/asc.py), archive, upload,
#              signed build provenance, GitHub release ios-v<version>-<build> with the IPA
#   beta       internal group + external group "Beta" with Beta App Review (Linux: it only waits
#              for Apple's processing, and a problem there cannot take the GitHub release down)
#   app-store  App Review, released after approval; skips while a version is with Apple, the next
#              push after that goes out as the next version
# Needs the repository secrets listed in docs/ios.md, "Automatic releases".
on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "!ios/**/*.md"
      - "!ios/HermesCallTests/**"
      - "!ios/HermesCallUITests/**"
      - "!ios/HermesCallKit/Tests/**"
      - ".github/workflows/ios-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  test:
    name: Swift core tests
    if: github.repository == 'quavon-dev/hermes-call'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: brew install libsodium
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --locked
      - name: swift test
        working-directory: ios/HermesCallKit
        run: swift test

  app-tests:
    name: App unit tests (simulator)
    # The same HermesCallTests as CI, so nothing reaches TestFlight that fails them. The UI tests
    # (HermesCallUITests) run in CI on every pull request; they do not gate the upload.
    if: github.repository == 'quavon-dev/hermes-call'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: brew install xcodegen
      - name: Metal toolchain (Presence.metal)
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Pick a simulator
        run: python3 tools/pick_simulator.py >>"$GITHUB_ENV"
      - name: Unit tests
        working-directory: ios
        run: >
          xcodebuild test -project HermesCall.xcodeproj -scheme HermesCall
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -only-testing:HermesCallTests
          CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=

  ios:
    name: Build, TestFlight upload and GitHub release
    needs: [test, app-tests]
    runs-on: macos-26
    timeout-minutes: 60
    environment: app-store
    permissions:
      contents: write
      id-token: write # build provenance attestation
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Check secrets and Xcode
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD_CERT_P12: ${{ secrets.BUILD_CERT_P12 }}
          BUILD_CERT_PASSWORD: ${{ secrets.BUILD_CERT_PASSWORD }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 BUILD_CERT_P12 BUILD_CERT_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::repository secret $name is missing (see docs/ios.md)"; exit 1; }
          done
          xcodebuild -version
          major=$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')
          [ "$major" -ge 26 ] || { echo "::error::Xcode 26 or newer is required (found $major)"; exit 1; }

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install signing material
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD_CERT_P12: ${{ secrets.BUILD_CERT_P12 }}
          BUILD_CERT_PASSWORD: ${{ secrets.BUILD_CERT_PASSWORD }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" | base64 --decode >"$RUNNER_TEMP/keys/AuthKey.p8"
          printf '%s' "$BUILD_CERT_P12" | base64 --decode >"$RUNNER_TEMP/keys/build.p12"
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/keys/build.p12" -k "$keychain" -P "$BUILD_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          # Without a usable development identity, automatic signing creates a new certificate on every run until the team limit.
          security find-identity -v -p codesigning "$keychain" | grep -q '"Apple Development' ||
            { echo "::error::BUILD_CERT_P12 holds no valid Apple Development certificate"; exit 1; }
          # shellcheck disable=SC2046 # keep the existing keychains (paths without spaces) after ours
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/keys/build.p12"

      - name: Version and build number from App Store Connect
        # Version: MARKETING_VERSION in ios/project.yml, or the next minor once Apple has approved it.
        # Build: highest number App Store Connect has for that version + 1 (at least the run number,
        # so a build Apple has not ingested yet is never reused).
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/keys/AuthKey.p8
        run: |
          asc() { uv run --quiet --no-project --with cryptography python tools/asc.py "$@"; }
          floor=$(awk -F'"' '/MARKETING_VERSION:/ { print $2; exit }' ios/project.yml)
          version=$(asc next-version --floor "$floor")
          build=$(asc next-build --version "$version" --at-least "${{ github.run_number }}")
          echo "Building $version ($build); MARKETING_VERSION is $floor"
          { echo "APP_VERSION=$version"; echo "BUILD_NUMBER=$build"; } >>"$GITHUB_ENV"

      - name: Generate project
        run: |
          brew install xcodegen
          xcodebuild -downloadComponent MetalToolchain
          cd ios && xcodegen generate

      - name: Archive
        working-directory: ios
        run: >
          xcodebuild archive -project HermesCall.xcodeproj -scheme HermesCall -configuration Release
          -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/HermesCall.xcarchive"
          -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8"
          -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Version
        id: version
        run: |
          plist="$RUNNER_TEMP/HermesCall.xcarchive/Info.plist"
          version=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$plist")
          { echo "version=$version"; echo "build=$BUILD_NUMBER"; echo "tag=ios-v$version-$BUILD_NUMBER"; } >>"$GITHUB_OUTPUT"

      - name: Export IPA and upload to TestFlight
        run: |
          team=$(awk -F' *= *' '$1 == "HC_TEAM" { print $2 }' ios/Config/Identity.xcconfig)
          for destination in export upload; do
            cat >"$RUNNER_TEMP/ExportOptions-$destination.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$destination</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$team</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
            xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/HermesCall.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-$destination.plist" \
              -exportPath "$RUNNER_TEMP/export-$destination" \
              -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
              -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          done
          mv "$RUNNER_TEMP/export-export/HermesCall.ipa" "$RUNNER_TEMP/HermesCall-${{ steps.version.outputs.version }}-$BUILD_NUMBER.ipa"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ runner.temp }}/HermesCall-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}.ipa

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          previous=$(git tag --list 'ios-v*' --sort=-creatordate | head -1)
          {
            echo "Hermes Call $VERSION (build $BUILD_NUMBER) for iPhone and Apple Watch, uploaded to TestFlight."
            echo
            echo "The IPA is signed for App Store distribution: it installs only through TestFlight or the App Store."
            echo "Relay and bridge releases are the \`v*\` releases. Verify that this IPA was built here:"
            echo
            echo '```'
            echo "gh attestation verify HermesCall-$VERSION-$BUILD_NUMBER.ipa --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo "App changes:"
            git log --format='- %s' ${previous:+$previous..}HEAD -- ios | head -50
          } >"$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$RUNNER_TEMP/HermesCall-$VERSION-$BUILD_NUMBER.ipa" \
            --target "$GITHUB_SHA" --latest=false --title "iOS $VERSION ($BUILD_NUMBER)" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/keys"

  beta:
    name: Internal and external TestFlight
    needs: ios
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: app-store
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Internal group, external group "Beta" and Beta App Review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          VERSION: ${{ needs.ios.outputs.version }}
          BUILD: ${{ needs.ios.outputs.build }}
          # Off until Apple's reviewers can test the app (review demo); then set the repository
          # variable ASC_EXTERNAL_BETA=true.
          EXTERNAL: ${{ vars.ASC_EXTERNAL_BETA == 'true' && 'Beta' || '' }}
        run: |
          umask 077
          printf '%s' "$ASC_KEY_P8" | base64 --decode >"$RUNNER_TEMP/AuthKey.p8"
          # "What to test": the app's commit subjects since the previous iOS release.
          previous=$(git tag --list 'ios-v*' --sort=-creatordate | grep -v "^ios-v$VERSION-$BUILD$" | head -1 || true)
          git log --format='- %s' ${previous:+$previous..}HEAD -- ios | head -30 >"$RUNNER_TEMP/what-to-test.txt"
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" uv run --quiet --no-project --with cryptography \
            python tools/asc.py beta-add --version "$VERSION" --build "$BUILD" --external "$EXTERNAL" \
            --notes-file "$RUNNER_TEMP/what-to-test.txt" --review-notes ios/appstore/beta-review-notes.txt

  app-store:
    name: App Review
    needs: ios
    # Off until the store listing and the review demo exist; then set ASC_APP_STORE=true.
    if: vars.ASC_APP_STORE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: app-store
    concurrency:
      group: ios-app-review
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Submit for App Review, release after approval
        # "What's New" comes from ios/appstore/notes/<version>/<locale>.txt (generic text if missing).
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$ASC_KEY_P8" | base64 --decode >"$RUNNER_TEMP/AuthKey.p8"
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" uv run --quiet --no-project --with cryptography \
            python tools/asc.py promote --version "${{ needs.ios.outputs.version }}" \
            --build "${{ needs.ios.outputs.build }}" --notes ios/appstore/notes
