name: Relay image

# Builds ghcr.io/quavon-dev/hermes-call-relay (push gateway by default, relay with another
# command; relay/Dockerfile):
#   push to main    :edge and :sha-<commit> (never :latest: main is not a release)
#   tag v1.2.3      :1.2.3, :1.2, :latest and :sha-<commit> (no :1.2 or :latest for v1.2.3-rc1)
# Every image is scanned with Trivy before it is pushed (a CRITICAL finding that has a fix fails the
# run), signed keylessly with cosign (Sigstore, this workflow's GitHub identity) and carries SBOM and
# provenance attestations. Deployments pin the digest from the job summary; this workflow holds no
# credentials for any deployment repository (docs/releasing.md, "Container image").
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "relay/hermescall_relay/**"
      - "common/hermescall_common/**"
      - "relay/Dockerfile"
      - ".dockerignore"
      - ".github/workflows/relay-image.yml"
  schedule:
    # Weekly rebuild: picks up Debian security updates of the python3-* packages.
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/quavon-dev/hermes-call-relay

jobs:
  test:
    name: Relay tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: debian:13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Distribution packages (the image's versions)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >
          apt-get update -qq && apt-get install -y -qq --no-install-recommends
          python3 python3-aiohttp python3-httpx python3-h2 python3-cryptography libsodium23
          python3-pytest python3-pytest-asyncio python3-pytest-aiohttp
      - run: PYTHONPATH=common:relay python3 -m pytest -q -p no:cacheprovider relay/tests

  image:
    name: Build, scan, push and sign
    needs: test
    if: github.repository == 'quavon-dev/hermes-call'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag must match the relay version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' relay/hermescall_relay/version.py)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but relay version $version"; exit 1; }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=Hermes Call push gateway and relay

      - name: Build for the scan (amd64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: relay/Dockerfile
          platforms: linux/amd64
          load: true
          tags: hermes-call-relay:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy (fail on CRITICAL with a fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hermes-call-relay:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Trivy report (HIGH and CRITICAL, informational)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hermes-call-relay:scan
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
          skip-setup-trivy: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Digest for deployments
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### $IMAGE"
            echo
            echo "Pin this digest in your deployment:"
            echo
            echo '```'
            echo "$IMAGE@$DIGEST"
            echo '```'
            echo
            echo "Tags: $(echo "$TAGS" | tr '\n' ' ')"
            echo
            echo "Verify the signature before you deploy it:"
            echo
            echo '```'
            echo "cosign verify $IMAGE@$DIGEST \\"
            echo "  --certificate-identity-regexp '(?i)^https://github\.com/quavon-dev/hermes-call/\.github/workflows/relay-image\.yml@refs/(heads/main|tags/v.*)$' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
