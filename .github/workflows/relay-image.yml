name: Relay image

# Builds ghcr.io/quavon-dev/hermes-call-relay (push gateway by default, relay with another
# command; relay/Dockerfile) when the relay or common code changes. On the main repository it then
# pins the new digest in Quavon's cluster repository, which rolls out hermes-push.quavon.de.
on:
  push:
    branches: [main]
    paths:
      - "relay/hermescall_relay/**"
      - "common/hermescall_common/**"
      - "relay/Dockerfile"
      - ".dockerignore"
      - ".github/workflows/relay-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/quavon-dev/hermes-call-relay

jobs:
  test:
    name: Relay tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: debian:13
    steps:
      - uses: actions/checkout@v5
      - name: Distribution packages (the image's versions)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >
          apt-get update -qq && apt-get install -y -qq --no-install-recommends
          python3 python3-aiohttp python3-httpx python3-h2 python3-cryptography libsodium23
          python3-pytest python3-pytest-asyncio python3-pytest-aiohttp
      - run: PYTHONPATH=common:relay python3 -m pytest -q -p no:cacheprovider relay/tests

  image:
    name: Build and push
    needs: test
    if: github.repository == 'quavon-dev/hermes-call'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=Hermes Call push gateway and relay

      - name: Pin the digest in the cluster repository
        # GHCR_TOKEN: a token with write access to Quavon-dev/k8s, as in Quavon's other app
        # repositories (see that repository's README, "Digests aus der Pipeline"). Without it the
        # image is still published and the cluster keeps its current digest.
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -z "$GHCR_TOKEN" ]; then
            echo "::warning::GHCR_TOKEN not set: $IMAGE@$DIGEST published but not pinned in Quavon-dev/k8s"
            exit 0
          fi
          git clone -q --depth 20 "https://x-access-token:${GHCR_TOKEN}@github.com/Quavon-dev/k8s.git" "$RUNNER_TEMP/k8s"
          "$RUNNER_TEMP/k8s/tools/pin-digest.sh" hermes-call "$IMAGE@$DIGEST"
