name: hermes-call
version: "0.8.2"
requires_hermes: ">=0.15"
description: Lets the agent phone its owner, chat with them, ask their phone for context and show them results through Hermes Call (hermes-call-bridge on 127.0.0.1).
provides_hooks:
  - pre_tool_call
  - post_tool_call
requires_env:
  - HERMES_CALL_TOKEN
