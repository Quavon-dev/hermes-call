name: HermesCall
# Shared values (YAML anchors).
x-shared-entitlements: &shared_entitlements
  com.apple.security.application-groups: [$(HC_APP_GROUP)]
  keychain-access-groups: [$(AppIdentifierPrefix)$(HC_BUNDLE_ID).shared]
# Team, bundle id and app group: Config/Identity.xcconfig (override in Identity.local.xcconfig).
configFiles:
  Debug: Config/Identity.xcconfig
  Release: Config/Identity.xcconfig
options:
  bundleIdPrefix: de.quavon
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: $(HC_TEAM)
    # One version for the app, its extensions and the watch app; CI overrides the build number.
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  HermesCallKit:
    path: HermesCallKit
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 153.0.0
targets:
  HermesCall:
    type: application
    platform: iOS
    sources:
      - path: HermesCall
        excludes: ["**/*.icon", "Resources/Licenses"]
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: HermesCall/Resources/AppIcon.icon
        type: file
        buildPhase: resources
      - path: HermesCall/Resources/AppIconPresence.icon
        type: file
        buildPhase: resources
      # Licence texts shown in Settings › Acknowledgements (a folder reference keeps the subdirectory).
      - path: HermesCall/Resources/Licenses
        type: folder
        buildPhase: resources
      - path: Shared
      - path: WatchShared
    dependencies:
      - package: HermesCallKit
        product: HermesCallCore
      - package: WebRTC
      - target: HermesCallWatch
      - target: HermesCallNotifications
      - target: HermesCallShare
      - target: HermesCallWidget
    entitlements:
      path: HermesCall/Resources/HermesCall.entitlements
      properties:
        aps-environment: development
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.homekit: true
        com.apple.developer.usernotifications.communication: true
        com.apple.security.application-groups: [$(HC_APP_GROUP)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(HC_BUNDLE_ID).shared]
    info:
      path: HermesCall/Resources/Info.plist
      properties:
        CFBundleDisplayName: Hermes Call
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HermesCallAppGroup: $(HC_APP_GROUP)
        HermesCallKeychainGroup: $(AppIdentifierPrefix)$(HC_BUNDLE_ID).shared
        CFBundleURLTypes:
          - CFBundleURLName: $(HC_BUNDLE_ID)
            CFBundleURLSchemes: [hermescall]
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        # 120 Hz for the presence on ProMotion iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [voip, audio]
        # Required with the communication-notifications entitlement (ITMS-90894); INStartCallIntent
        # is what iOS hands the app when a call is tapped in the Phone app's Recents, INSendMessageIntent
        # marks chat notifications as messages from the agent (name, presence, Focus).
        NSUserActivityTypes: [INStartCallIntent, INSendMessageIntent]
        # Export compliance, answered by Quavon UG on 2026-09-30: the app uses standard encryption
        # (TLS, libsodium) and is treated as exempt, so builds need no manual answer per upload.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: The camera scans the pairing QR code of your bridge, takes the photos you send in the chat, and during a call it shows your agent what you point it at when you choose Look. Pictures go end-to-end encrypted to your own bridge only.
        NSFaceIDUsageDescription: Face ID confirms that you approve a command your assistant wants to run.
        # Phone access (docs/protocol.md "Phone context"): only read when the owner's rule allows it.
        NSLocationWhenInUseUsageDescription: When you allow it, your agent can ask where you are (about 1 km unless you allow precise). It is sent end-to-end encrypted to your own bridge only.
        NSLocationAlwaysAndWhenInUseUsageDescription: Place reminders your agent sets for you ("when I'm at the supermarket") are watched by this iPhone itself, also while the app is closed. Your location is never sent to your agent for this; searching a place by name asks Apple Maps with only an area of about 5 km around you.
        NSSupportsLiveActivities: true
        NSCalendarsFullAccessUsageDescription: When you allow it, your agent can read your upcoming events, or add an event you see first. Events are sent end-to-end encrypted to your own bridge only.
        NSRemindersFullAccessUsageDescription: When you allow it, your agent can read your open reminders, or add a reminder you see first. Reminders are sent end-to-end encrypted to your own bridge only.
        NSContactsUsageDescription: When you allow it, your agent can look up a contact by name (up to 5 matches). Results are sent end-to-end encrypted to your own bridge only.
        NSMotionUsageDescription: When you allow it, your agent can ask whether you are walking or driving and for today's steps. Sent end-to-end encrypted to your own bridge only.
        NSAppleMusicUsageDescription: When you allow it, your agent can ask which song is playing in the Music app. Sent end-to-end encrypted to your own bridge only.
        NSHealthShareUsageDescription: When you allow it, your agent can read today's steps and active energy, last night's sleep and your resting heart rate. Sent end-to-end encrypted to your own bridge only; nothing is written to Health.
        # Required by App Store validation whenever the HealthKit entitlement is present, even without writes.
        NSHealthUpdateUsageDescription: Hermes Call never writes to Health; it only reads what you allow above.
        NSFocusStatusUsageDescription: When you allow it, your agent can ask whether a Focus is on, so it knows when not to disturb you. Sent end-to-end encrypted to your own bridge only.
        NSLocalNetworkUsageDescription: Hermes Call connects calls directly to your own bridge when it is on the same network as this iPhone.
        NSHomeKitUsageDescription: When you allow it, your agent can read which Home accessories are on. Hermes Call never controls them. Sent end-to-end encrypted to your own bridge only.
        NSMicrophoneUsageDescription: Hermes Call uses the microphone while you are on a call with your assistant and when you record a voice note. Audio is end-to-end encrypted to your own bridge.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HC_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconPresence
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
  HermesCallNotifications:
    type: app-extension
    platform: iOS
    sources:
      - HermesCallNotifications
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: HermesCallKit
        product: HermesCallCore
      - sdk: WidgetKit.framework
    entitlements:
      path: HermesCallNotifications/HermesCallNotifications.entitlements
      properties: *shared_entitlements
    info:
      path: HermesCallNotifications/Info.plist
      properties:
        CFBundleDisplayName: Hermes Call Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HermesCallAppGroup: $(HC_APP_GROUP)
        HermesCallKeychainGroup: $(AppIdentifierPrefix)$(HC_BUNDLE_ID).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
          # Agent messages are communication notifications (INSendMessageIntent).
          NSExtensionAttributes:
            IntentsSupported: [INSendMessageIntent]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HC_BUNDLE_ID).notifications
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
  HermesCallShare:
    type: app-extension
    platform: iOS
    sources:
      - HermesCallShare
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: HermesCallKit
        product: HermesCallCore
    entitlements:
      path: HermesCallShare/HermesCallShare.entitlements
      properties: *shared_entitlements
    info:
      path: HermesCallShare/Info.plist
      properties:
        CFBundleDisplayName: Hermes Call
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HermesCallAppGroup: $(HC_APP_GROUP)
        HermesCallKeychainGroup: $(AppIdentifierPrefix)$(HC_BUNDLE_ID).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 4
              NSExtensionActivationSupportsFileWithMaxCount: 4
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HC_BUNDLE_ID).share
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
  HermesCallWidget:
    type: app-extension
    platform: iOS
    sources:
      - HermesCallWidget
      - Shared
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: HermesCallKit
        product: HermesCallCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    entitlements:
      path: HermesCallWidget/HermesCallWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(HC_APP_GROUP)]
    info:
      path: HermesCallWidget/Info.plist
      properties:
        CFBundleDisplayName: Hermes Call
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HermesCallAppGroup: $(HC_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HC_BUNDLE_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
  # Apple Watch: remote and chat through the iPhone (WatchConnectivity); no relay keys, no WebRTC on the watch.
  HermesCallWatch:
    type: application
    platform: watchOS
    sources:
      - path: HermesCallWatch
        excludes: ["**/*.icon"]
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: HermesCallWatch/AppIcon.icon
        type: file
        buildPhase: resources
      - path: WatchShared
    dependencies:
      - target: HermesCallWatchWidget
    entitlements:
      path: HermesCallWatch/HermesCallWatch.entitlements
      properties:
        com.apple.security.application-groups: [$(HC_APP_GROUP)]
    info:
      path: HermesCallWatch/Info.plist
      properties:
        CFBundleDisplayName: Hermes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HermesCallAppGroup: $(HC_APP_GROUP)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(HC_BUNDLE_ID)
        NSMicrophoneUsageDescription: Hermes records a voice note on your watch when you choose it; your iPhone sends it end-to-end encrypted to your own bridge.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HC_BUNDLE_ID).watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HermesCallWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - HermesCallWatchWidget
      - WatchShared/WatchPalette.swift
      - WatchShared/PresenceSketch.swift
      - WatchShared/WatchLink.swift
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: HermesCallWatchWidget/HermesCallWatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(HC_APP_GROUP)]
    info:
      path: HermesCallWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Hermes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HermesCallAppGroup: $(HC_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HC_BUNDLE_ID).watchkitapp.widget
        APPLICATION_EXTENSION_API_ONLY: YES
  HermesCallTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HermesCallTests]
    dependencies:
      - target: HermesCall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HC_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  # UI flows on the offline demo agent (onboarding, demo chat and call, presence, settings).
  HermesCallUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HermesCallUITests]
    dependencies:
      - target: HermesCall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HC_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HermesCall
schemes:
  HermesCall:
    build:
      targets:
        HermesCall: all
    test:
      targets: [HermesCallTests, HermesCallUITests]
